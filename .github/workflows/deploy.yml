# Build LoxDetective and publish it to GitHub Pages.
#
# One-time repository setup: Settings → Pages → Build and deployment →
# Source: "GitHub Actions". After that, every push to the repository's
# DEFAULT branch (whatever it is called: main, master, trunk…) or a manual run
# from the Actions tab publishes https://loxlid.github.io/loxdetective/.
#
# The workflow is triggered by pushes to every branch so that it also exists
# on forks whose default branch has a different name, but the jobs only run
# when the pushed ref is the default branch (`github.event.repository.default_branch`).
# Other branches are covered by ci.yml.
name: Deploy to GitHub Pages

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel a run that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  NODE_VERSION: 22

jobs:
  build:
    name: Build
    # Deploy from the default branch only (manual runs are allowed from any ref).
    if: github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Project site → served under /<repo>/. Set to "/" for a custom domain.
          VITE_BASE: /loxdetective/

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Try to switch Pages on for a repository that never enabled it. Works on
          # repositories where GITHUB_TOKEN may enable Pages; otherwise enable it once
          # under Settings → Pages → Source: GitHub Actions and re-run.
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    if: github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
